name: CI — code and desktop builds
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - label: mac-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - label: mac-intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js (version pinned in .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Rust (version pinned in rust-toolchain.toml) and target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86 only; AVIF decoder assembly, ADR-027)
        if: ${{ startsWith(matrix.target, 'x86_64') }}
        uses: ilammy/setup-nasm@v1
      - name: Install JS dependencies from lockfile
        run: npm ci
      - name: JS linter
        run: npm run lint
      - name: Frontend automated tests
        run: npm run test
      - name: TypeScript/production web build
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Build platform installer (not a manual install test)
        # Installers are release evidence, not a PR check (docs/16): building
        # them takes ~35 min on Windows, so PRs skip it (ADR-042).
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # macOS: ad-hoc signature for unsigned previews (docs/13). This does
          # not satisfy Gatekeeper. Ignored on Windows.
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Stage exactly one installer for evidence
        # Installers are release evidence, not a PR check (docs/16): building
        # them takes ~35 min on Windows, so PRs skip it (ADR-042).
        if: ${{ github.event_name != 'pull_request' }}
        run: python scripts/stage_release.py --platform ${{ matrix.label }} --version ci
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: ci-${{ matrix.label }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Rust advisories, licences, bans and sources (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
