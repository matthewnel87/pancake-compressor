<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Pancake Compressor concept A: squashed pancake stack</title>
  <!-- App tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#FFF4E2"/>
  <!-- Plate shadow -->
  <ellipse cx="256" cy="392" rx="170" ry="26" fill="#E8D7BE"/>
  <!-- Bottom pancake -->
  <rect x="92" y="300" width="328" height="78" rx="39" fill="#8A4A1A"/>
  <rect x="92" y="300" width="328" height="58" rx="29" fill="#D98B3A"/>
  <!-- Middle pancake: wider and flatter, the "squashed" layer -->
  <rect x="70" y="240" width="372" height="64" rx="32" fill="#8A4A1A"/>
  <rect x="70" y="240" width="372" height="46" rx="23" fill="#E9A54B"/>
  <!-- Top pancake -->
  <rect x="104" y="170" width="304" height="76" rx="38" fill="#8A4A1A"/>
  <rect x="104" y="170" width="304" height="56" rx="28" fill="#F0B25A"/>
  <!-- Butter -->
  <rect x="216" y="140" width="80" height="44" rx="12" fill="#F8D27D" stroke="#C9963D" stroke-width="6"/>
  <!-- Squeeze marks either side of the middle layer -->
  <path d="M40 272 h22 M450 272 h22" stroke="#A65B22" stroke-width="12" stroke-linecap="round"/>
</svg>
