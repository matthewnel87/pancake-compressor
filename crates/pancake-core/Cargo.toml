[package]
name = "pancake-core"
description = "Offline image compression engine for Pancake Compressor (no GUI, no network)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published to crates.io; distributed only inside the desktop app.
publish = false

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
