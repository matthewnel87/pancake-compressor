[package]
name = "pancake-core"
description = "Offline image compression engine for Pancake Compressor (no GUI, no network)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published to crates.io; distributed only inside the desktop app.
publish = false

[dependencies]
avif-decode = { version = "3.0.0", default-features = false }
avif-parse = "2.1.0"
bytemuck = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
imagequant = { version = "4.4.1", default-features = false }
imgref = "1.12"
mozjpeg = "0.10.13"
oxipng = { version = "10.2.1", default-features = false }
png = "0.18"
ravif = "0.13.0"
tempfile = "3.27"
webp = { version = "0.3.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
