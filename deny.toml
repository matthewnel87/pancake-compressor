# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
#
# Pancake Compressor is distributed as GPL-3.0-or-later (ADR-005), so every
# dependency licence must be GPL-3.0-compatible. Adding a licence to `allow`
# needs a note in docs/04-stack-dependencies-and-licences.md explaining why it
# is compatible. Run locally with `cargo deny check`.

[graph]
# Check what actually ships on the three supported desktop targets.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
# Known vulnerabilities and unmaintained crates from the RustSec database.
yanked = "deny"
# Each ignore needs a reason and must be revisited when the dependency changes.
ignore = [
  # `paste` is archived (unmaintained, not vulnerable). It is a compile-time
  # proc-macro used by the AV1 crates rav1d and rav1e; none of its code runs
  # in the app. Remove once those crates migrate (e.g. to `pastey`).
  { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro only, no runtime code (docs/04)" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "GPL-3.0-or-later",  # this project
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",      # rav1d (AV1 decoder), rav1e
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "IJG",               # MozJPEG; GPL-compatible, but requires an attribution
                       # line in release documentation (docs/04, NOTICES)
  "Unicode-3.0",
  "MPL-2.0",           # file-level copyleft; GPL-compatible via MPL section 3.3
  "CC0-1.0",
  "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside this workspace are not wildcards.
allow-wildcard-paths = true

[sources]
# Only crates.io. A git or alternative registry dependency needs an ADR.
unknown-registry = "deny"
unknown-git = "deny"
