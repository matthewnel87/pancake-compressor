# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
#
# Pancake Compressor is distributed as GPL-3.0-or-later (ADR-005), so every
# dependency licence must be GPL-3.0-compatible. Adding a licence to `allow`
# needs a note in docs/04-stack-dependencies-and-licences.md explaining why it
# is compatible. Run locally with `cargo deny check`.

[graph]
# Check what actually ships on the three supported desktop targets.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
# Known vulnerabilities and unmaintained crates from the RustSec database.
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
  "GPL-3.0-or-later",  # this project
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",           # file-level copyleft; GPL-compatible via MPL section 3.3
  "CC0-1.0",
  "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside this workspace are not wildcards.
allow-wildcard-paths = true

[sources]
# Only crates.io. A git or alternative registry dependency needs an ADR.
unknown-registry = "deny"
unknown-git = "deny"
